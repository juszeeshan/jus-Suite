<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>Jus Suite</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open apps menu"><span class="hamburger">☰</span></button>
    <div class="brand"><span class="brand-mark">J</span><div><strong>JUS SUITE</strong><small id="topSubtitle">Your workspace</small></div></div>
    <button class="icon-btn" id="homeBtn" aria-label="Home">⌂</button>
  </header>
  <main id="mainContent" class="main-content"></main>
</div>
<div id="frames" hidden></div>
<button id="floatMenu" hidden aria-label="Open apps menu">☰</button>
<div id="drawerBackdrop" class="backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><div class="brand-mark big">J</div><div><strong>JUS SUITE</strong><small>Your workspace</small></div><button id="closeDrawer" class="close-btn" aria-label="Close">×</button></div>
  <div class="drawer-label">YOUR APPS</div>
  <nav id="appNav"></nav>
  <div class="drawer-bottom"><div class="drawer-label">WORKSPACE</div><button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button><p>One space. Three tools.</p></div>
</aside>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
